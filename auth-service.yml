server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/bootcamp_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Redis for Token Blacklisting & Caching
  data:
    redis:
      host: localhost
      port: 6379

